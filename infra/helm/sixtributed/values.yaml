namespace: sistem-informasi-kebencanaan-bnpb

imagePullPolicy: IfNotPresent

# Resource classes per M2 spec Lampiran B (memory requests/limits; CPU optional).
resourceClasses:
  aggregator: {requests: {memory: 256Mi}, limits: {memory: 512Mi}}
  store: {requests: {memory: 512Mi}, limits: {memory: 1Gi}}
  broker: {requests: {memory: 512Mi}, limits: {memory: 1Gi}}
  consumer: {requests: {memory: 128Mi}, limits: {memory: 256Mi}}
  authapi: {requests: {memory: 128Mi}, limits: {memory: 256Mi}}
  mock: {requests: {memory: 64Mi}, limits: {memory: 128Mi}}
  other: {requests: {memory: 128Mi}, limits: {memory: 256Mi}}

components:
  aggregator:
    role: aggregator
    class: aggregator
    image: sixtributed/aggregator:m2
    replicas: 3
    port: 8090
    probes: true
    volcano: true
    secret: aggregator
    auxPostgres: true
    env:
      AGGREGATOR_PORT: "8090"
      BMKG_URL: http://bmkg-mock:8081
      PVMBG_URL: http://pvmbg-mock:8082
      KAFKA_BROKERS: redpanda-0.redpanda:9092
      VOLCANO_REFERENCE_PATH: /data/volcanoes.json
      AGGREGATOR_POSTGRES_DSN: postgres://aggregator:aggregator@aggregator-postgres:5432/aggregator?sslmode=disable
      POD_NAMESPACE: sistem-informasi-kebencanaan-bnpb
      STORE_LABEL_SELECTOR: app=store-unit
      SHARD_COUNT: "3"

  auth-service:
    role: api
    class: authapi
    image: sixtributed/auth-service:m2
    replicas: 1
    port: 8091
    probes: true
    secret: auth-service
    env:
      AUTH_PORT: "8091"
      MEDIA_CLIENT_ID: media
      FIELD_CLIENT_ID: field-team
      INTERNAL_CLIENT_ID: internal-ops

  client-api:
    role: api
    class: authapi
    image: sixtributed/client-api:m2
    replicas: 1
    port: 8080
    probes: true
    secret: client-api
    env:
      CLIENT_API_PORT: "8080"
      AGGREGATOR_URL: http://aggregator:8090
      KAFKA_BROKERS: redpanda-0.redpanda:9092

  consumer-dashboard:
    role: consumer
    class: consumer
    image: sixtributed/consumer:m2
    replicas: 1
    port: 8083
    probes: true
    env:
      CONSUMER_NAME: dashboard
      CONSUMER_QUEUE: dashboard.queue
      HEALTH_PORT: "8083"
      KAFKA_BROKERS: redpanda-0.redpanda:9092

  consumer-notifier:
    role: consumer
    class: consumer
    image: sixtributed/consumer:m2
    replicas: 1
    port: 8084
    probes: true
    auxPostgres: true
    env:
      CONSUMER_NAME: notifier
      CONSUMER_QUEUE: notifier.queue
      HEALTH_PORT: "8084"
      NOTIFIER_POSTGRES_DSN: postgres://notifier:notifier@consumer-notifier-postgres:5432/notifications?sslmode=disable
      KAFKA_BROKERS: redpanda-0.redpanda:9092

  bmkg-mock:
    role: mock
    class: mock
    image: sixtributed/bmkg-mock:m2
    replicas: 1
    port: 8081
    probes: true
    secret: bmkg
    env:
      BMKG_PORT: "8081"
      POLL_INTERVAL_SECONDS: "3"

  pvmbg-mock:
    role: mock
    class: mock
    image: sixtributed/pvmbg-mock:m2
    replicas: 1
    port: 8082
    probes: true
    secret: pvmbg
    env:
      PVMBG_PORT: "8082"

  coastal-gateway:
    role: sensor
    class: other
    image: sixtributed/coastal-gateway:m2
    replicas: 1
    port: 8110
    probes: true
    secret: coastal-gateway
    env:
      PORT: "8110"
      SENSOR_BASE_URL: http://sensor-pantai:8080
      STORE_URL: http://store:8100
      KAFKA_BROKERS: redpanda-0.redpanda:9092

  fire-builder:
    role: consumer
    class: consumer
    image: sixtributed/fire-builder:m2
    replicas: 1
    port: 8130
    probes: true
    provinces: true # mount files/provinces.json at /data/provinces.json
    auxPostgres: true
    env:
      PORT: "8130"
      FIRE_POSTGRES_DSN: postgres://fire:fire@fire-builder-postgres:5432/fire?sslmode=disable
      KAFKA_BROKERS: redpanda-0.redpanda:9092
      STORE_URL: http://store:8100
      PROVINCE_REFERENCE_PATH: /data/provinces.json

  report-consumer:
    role: consumer
    class: consumer
    image: sixtributed/report-consumer:m2
    replicas: 1
    port: 8086
    probes: true
    auxPostgres: true
    env:
      HEALTH_PORT: "8086"
      REPORT_POSTGRES_DSN: postgres://report:report@report-consumer-postgres:5432/report?sslmode=disable
      KAFKA_BROKERS: redpanda-0.redpanda:9092

  feed-ingestor:
    role: other
    class: other
    image: sixtributed/feed-ingestor:m2
    replicas: 1
    port: 8120
    probes: true
    auxPostgres: true
    secret: feed-ingestor
    env:
      PORT: "8120"
      HEALTH_PORT: "8120"
      SSE_START_OFFSET: "0"
      INGESTOR_POSTGRES_DSN: postgres://ingestor:ingestor@feed-ingestor-postgres:5432/ingestor?sslmode=disable
      KAFKA_BROKERS: redpanda-0.redpanda:9092

  bmkg-mock:
    role: mock
    class: mock
    image: sixtributed/bmkg-mock:m2
    replicas: 1
    port: 8081
    probes: true
    secret: bmkg
    env:
      BMKG_PORT: "8081"
      POLL_INTERVAL_SECONDS: "3"

# Store: 3 shards, each with a primary + standby unit (one pod each, PG sidecar
# inside). Per-shard StatefulSets give stable per-pod DNS names
# (store-primary-N-0.store-pg-N / store-standby-N-0.store-pg-N), which the
# writers use for 422/503 shard routing. Node pinning (store.nodes) keeps a
# shard's two copies on different nodes; set nodes to [] to disable (kind).
store:
  units: 3
  port: 8100
  image: sixtributed/store:m2
  # Node pinning: when non-empty, shard N's primary is pinned to nodes[N mod len]
  # and its standby to nodes[(N+1) mod len], so a shard's two copies never share
  # a node. Default [] disables pinning (smoke / any cluster). values-prod.yaml
  # sets the k3s node list.
  nodes: []
  postgres:
    image: postgres:16
    port: 5432
  # hostPath root; pod for (shard-N, replica) gets <root>-shard-N-<replica>
  # (DirectoryOrCreate), i.e. /var/sixtributed/store-shard-0-primary...
  hostPathRoot: /var/sixtributed/store
  # PEER_DSN pairing: unit N pairs with unit (N+1) mod units on the OTHER node.
  peerServicePort: 5432
  env:
    PORT: "8100"
    SHARD_COUNT: "3"

redpanda:
  enabled: true
  image: redpandadata/redpanda:v24.3.1
  port: 9092
  storage: 10Gi
  # Redpanda internal memory budget; keep well below the 1Gi container limit.
  smp: 1
  memory: 700M

# Per-service auxiliary PostgreSQL (fire-builder, report-consumer, feed-ingestor).
# user/password per service must match the *_POSTGRES_DSN in that service's env.
auxPostgres:
  image: postgres:16
  users:
    aggregator: {user: aggregator, password: aggregator, db: aggregator}
    fire-builder: {user: fire, password: fire, db: fire}
    report-consumer: {user: report, password: report, db: report}
    feed-ingestor: {user: ingestor, password: ingestor, db: ingestor}
    consumer-notifier: {user: notifier, password: notifier, db: notifications}
  storageClass: ""

topics:
  - {name: hazard.events, partitions: 6}
  - {name: detections.raw, partitions: 6}
  - {name: field-reports, partitions: 6}
  - {name: fire.clusters, partitions: 3}

# Secrets fed from .env-style values; each entry becomes one Secret named `<key>-secret`.
secrets:
  aggregator:
    BMKG_API_KEY: example-bmkg-key
    PVMBG_TOKEN: example-pvmbg-token
    AUDIT_TOKEN: smoke-audit-token
  auth-service:
    JWT_SIGNING_KEY: replace-with-a-long-random-development-secret
    MEDIA_CLIENT_SECRET: media-secret
    FIELD_CLIENT_SECRET: field-secret
    INTERNAL_CLIENT_SECRET: internal-secret
  client-api:
    JWT_SIGNING_KEY: replace-with-a-long-random-development-secret
    AUDIT_TOKEN: smoke-audit-token
  bmkg:
    BMKG_API_KEY: example-bmkg-key
  pvmbg:
    PVMBG_TOKEN: example-pvmbg-token
  coastal-gateway:
    PANTAI_AUTH_TOKEN: change-me-pantai-token
  feed-ingestor:
    SATELLITE_TOKEN: change-me-satellite-token

# Postgres sidecar credentials inside each store unit (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB
# are injected into the postgres container; the store container gets POSTGRES_DSN built from them).
storePostgres:
  POSTGRES_USER: store
  POSTGRES_PASSWORD: store
  POSTGRES_DB: sixtributed

ingress:
  enabled: true
  className: traefik
  host: ""
